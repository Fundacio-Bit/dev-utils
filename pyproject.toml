[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-utils"
version = "0.1.0"
description = "Base operativa y plantilla para automatización con Bash y utilidades Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "gdeignacio" }
]
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
]

[project.scripts]
hello = "scripts.hello:main"
# Los scripts del proyecto pueden exponerse aquí cuando se necesite:
# app-settings = "scripts.settings:main"
# app-setenv = "scripts.env:main"
# app-clearenvbackup = "scripts.backup:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.setuptools]
packages = ["scripts"]

[tool.setuptools.package-data]
scripts = []
